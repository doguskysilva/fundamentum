[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamentum"
version = "0.2.0"
description = "All common core structure and functions to be used on dogusky.cloud"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
  { name = "Douglas Silva" }
]

dependencies = [
  "fastapi>=0.128",
  "httpx>=0.28",
  "pydantic-settings>=2.12.0",
  "python-json-logger>=4.0.0",
]

[project.optional-dependencies]
# Optional Prometheus adapter for infra.observability.metrics — never
# imported unless a service explicitly opts in, so it's not a hard dep.
metrics = ["prometheus-client>=0.21"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fundamentum = ["py.typed"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "prometheus-client>=0.21",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# No type stubs published for this dependency.
module = "pythonjsonlogger.*"
ignore_missing_imports = true
